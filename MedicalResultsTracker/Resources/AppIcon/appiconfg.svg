<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Передний план иконки: ломаная значений и полоса нормы — ровно то, что делает приложение.

  Красный крест не используется намеренно: это защищённая эмблема (Женевские конвенции,
  в Германии § 125 StGB), в приложении о здоровье брать её нельзя.

  Вся графика лежит внутри центральных ~66 % холста: за этой границей Android обрежет её
  своей маской. Штрихи толстые — на 48 px тонкая линия исчезает.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Полоса референсного диапазона -->
    <rect x="96" y="196" width="264" height="76" rx="38" fill="#FFFFFF" fill-opacity="0.26" />

    <!-- Динамика: провал под норму и возврат выше неё -->
    <polyline points="112,318 180,254 250,282 326,166" fill="none" stroke="#FFFFFF"
              stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="112" cy="318" r="15" fill="#FFFFFF" />
    <circle cx="180" cy="254" r="15" fill="#FFFFFF" />
    <circle cx="250" cy="282" r="15" fill="#FFFFFF" />

    <!-- Последнее значение выделено: ради него приложение и открывают -->
    <circle cx="326" cy="166" r="31" fill="#FFB020" />
    <circle cx="326" cy="166" r="13" fill="#0F5F6B" />
</svg>
