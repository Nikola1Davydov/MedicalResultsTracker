name: Build

# Проверка сборки на каждый пуш: без неё ошибка компиляции всплывает только на машине
# разработчика. Debug-APK подписан отладочным ключом и ставится на телефон,
# так что артефакт годится для быстрой проверки, не дожидаясь релиза.
#
# Триггера намеренно два, а не три. Раньше был ещё pull_request, и он собирал ровно тот же
# коммит, что уже собрался по push, — две одинаковые сборки одновременно на каждый PR.
on:
  push:
    branches: ['**']

    # Правки документации собирать нечего: код от них не меняется.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущую сборку: проверять устаревший коммит незачем,
# а очередь из параллельных запусков только мешает понять, какой из них актуальный.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore MedicalResultsTracker/MedicalResultsTracker.csproj

      # SignAndroidPackage компилирует и упаковывает: отдельный build перед ним был бы
      # той же работой дважды.
      - name: Build and package
        run: >
          dotnet build MedicalResultsTracker/MedicalResultsTracker.csproj
          -c Debug -f net10.0-android --no-restore
          -t:SignAndroidPackage -p:AndroidPackageFormat=apk

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find MedicalResultsTracker/bin/Debug/net10.0-android -name '*-Signed.apk' | head -1)
          if [ -z "$apk" ]; then
            apk=$(find MedicalResultsTracker/bin/Debug/net10.0-android -name '*.apk' | head -1)
          fi
          if [ -z "$apk" ]; then
            echo "APK не найден" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-results-tracker-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
