name: Release APK

# Собирает установочный APK и кладёт его в GitHub Releases.
#
# Кнопка "Run workflow" — основной путь: вводится тег, и релиз создаётся сам,
# тег ставить руками не нужно. Пустое поле — репетиция: APK собирается и
# подписывается, но Releases не трогается, файл остаётся артефактом запуска.
#
# Пуш тега вида v1.0.0 работает как раньше — на случай релиза из командной строки.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v1.0.0. Пусто — только собрать, без публикации'
        required: false
        default: ''

permissions:
  contents: write

# Отменять релиз на полпути нельзя: он мог уже создать тег и залить файл.
# Поэтому запуски выстраиваются в очередь, а не вытесняют друг друга.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Тег определяет и версию в приложении, и то, будет ли релиз вообще.
      # Пустой тег (ручной запуск с пустым полем) — сборка без публикации.
      - name: Resolve version
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${TAG_INPUT:-}"
          fi

          # Пробелы по краям — обычная опечатка при вводе в поле формы.
          tag="$(printf '%s' "$tag" | tr -d '[:space:]')"

          if [ -n "$tag" ]; then
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
            display="${tag#v}"

            if ! printf '%s' "$display" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::Тег должен выглядеть как v1.0.0 — получено «$tag»."
              exit 1
            fi
          else
            display="0.0.${GITHUB_RUN_NUMBER}"
          fi

          # versionCode (ApplicationVersion) выводится из самого тега, а не из номера запуска.
          # Иначе пересборка того же тега дала бы APK с другим номером версии — и тег перестал бы
          # однозначно означать сборку. Ограничение схемы: minor и patch меньше 1000.
          if [ -n "$tag" ]; then
            core="${display%%[-+]*}"
            major="$(printf '%s' "$core" | cut -d. -f1)"
            minor="$(printf '%s' "$core" | cut -d. -f2)"
            patch="$(printf '%s' "$core" | cut -d. -f3)"
            code=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))

            # Android требует versionCode не меньше единицы.
            [ "$code" -lt 1 ] && code=1
          else
            code="$GITHUB_RUN_NUMBER"
          fi

          echo "display=$display" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Один тег — одна сборка. Если тег уже указывает на другой коммит, значит под тем же
      # номером версии выйдет другой код: у пользователя на телефоне «1.2.0» будет означать
      # не то же, что в репозитории. Такой запуск останавливаем, а не перезаписываем молча.
      - name: Check tag is free
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          existing=""

          # Несуществующий тег — обычное дело: это первый выпуск с таким номером.
          # Ответ об ошибке gh печатает в stdout, поэтому мало проверить, что вывод непустой:
          # принимаем только то, что действительно выглядит как SHA коммита.
          if raw="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null)"; then
            if printf '%s' "$raw" | grep -Eq '^[0-9a-f]{40}$'; then
              existing="$raw"
            fi
          fi

          if [ -z "$existing" ]; then
            echo "Тег $TAG свободен."
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Тег $TAG уже стоит на коммите $existing, а собирается $GITHUB_SHA. Возьмите следующий номер версии."
            exit 1
          else
            echo "Тег $TAG уже стоит на этом же коммите — файл релиза будет обновлён."
          fi

      # Ключ подписи. Постоянный ключ из секретов позволяет ставить новую версию поверх старой;
      # без него генерируется одноразовый, и обновление поверх установленной сборки Android отклонит.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/app.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
            echo "Использую постоянный ключ из секретов."
          else
            keytool -genkeypair -v -keystore "$keystore" \
              -alias ephemeral -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ephemeral-password -keypass ephemeral-password \
              -dname "CN=MedicalResultsTracker, OU=personal, O=personal, L=-, ST=-, C=DE"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Постоянный ключ не настроен — сборка подписана одноразовым. Поставить её поверх уже установленной не получится."
          fi
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      # Пароли передаются через переменные окружения, а не в тексте команды:
      # так они не попадают ни в список процессов, ни в лог.
      - name: Publish signed APK
        env:
          KEYSTORE: ${{ steps.signing.outputs.path }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store_pass="${STORE_PASS:-ephemeral-password}"
          key_alias="${KEY_ALIAS:-ephemeral}"
          key_pass="${KEY_PASS:-ephemeral-password}"

          dotnet publish MedicalResultsTracker/MedicalResultsTracker.csproj \
            -c Release -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$KEYSTORE" \
            -p:AndroidSigningStorePass="$store_pass" \
            -p:AndroidSigningKeyAlias="$key_alias" \
            -p:AndroidSigningKeyPass="$key_pass"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          apk=$(find MedicalResultsTracker/bin/Release/net10.0-android -name '*-Signed.apk' | head -1)
          if [ -z "$apk" ]; then
            apk=$(find MedicalResultsTracker/bin/Release/net10.0-android -name '*.apk' | head -1)
          fi
          if [ -z "$apk" ]; then
            echo "APK не найден" >&2
            exit 1
          fi
          target="$RUNNER_TEMP/MedicalResultsTracker-${{ steps.version.outputs.display }}.apk"
          cp "$apk" "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: medical-results-tracker-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        id: notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Установочный файл для Android."
            echo
            echo "**Как поставить:** скачайте \`.apk\` ниже, откройте его на телефоне и разрешите"
            echo "установку из этого источника, когда Android спросит."
            echo
            echo "Все данные остаются на устройстве: приложение не требует аккаунта и работает офлайн."
            if [ "${{ steps.signing.outputs.persistent }}" != "true" ]; then
              echo
              echo "> ⚠️ Сборка подписана одноразовым ключом: поставить её поверх ранее установленной"
              echo "> версии не выйдет — сначала удалите старую (данные при этом пропадут, сделайте"
              echo "> резервную копию в настройках). Чтобы обновления ставились поверх, настройте"
              echo "> постоянный ключ — см. docs/CI.md."
            fi
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      # Тег пустой — значит это репетиция, и публиковать нечего.
      # При ручном запуске тег создаётся самим gh на текущем коммите (--target).
      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: MedicalResultsTracker ${{ steps.version.outputs.display }}
          APK: ${{ steps.apk.outputs.path }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Сюда доходим только если тег указывает на этот же коммит: шаг «Check tag is free»
            # уже отсёк случай, когда под тем же номером версии лежит другой код.
            gh release upload "$TAG" "$APK" --clobber
            echo "Релиз $TAG уже был на этом коммите — файл обновлён."
          else
            gh release create "$TAG" "$APK" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
            echo "Создан релиз $TAG."
          fi

      - name: Summary
        run: |
          {
            echo "### APK собран"
            echo
            echo "Версия: \`${{ steps.version.outputs.display }}\` (versionCode \`${{ steps.version.outputs.code }}\`)"
            if [ "${{ steps.signing.outputs.persistent }}" = "true" ]; then
              echo "Подпись: постоянный ключ из секретов — обновления встанут поверх."
            else
              echo "Подпись: одноразовый ключ. Настройте секреты, см. docs/CI.md."
            fi
            if [ -z "${{ steps.version.outputs.tag }}" ]; then
              echo
              echo "Тег не задан — релиз не создавался, файл лежит в артефактах этого запуска."
            else
              echo
              echo "Релиз: \`${{ steps.version.outputs.tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
